<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showbox – TV Show Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="Showbox home">Showbox</a>
    <nav class="tabs" aria-label="Views">
      <button class="tab is-active" data-view="browse" type="button">Browse</button>
      <button class="tab" data-view="watchlist" type="button">Watchlist <span class="count" id="watch-count">0</span></button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Find your next show.</h1>
      <p class="hero-sub">Search thousands of TV series, save the ones you want to watch, and come back to them any time.</p>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search-input">Search TV shows</label>
        <input id="search-input" type="search" placeholder="Try “Breaking Bad” or “Sherlock”" autocomplete="off">
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="toolbar" aria-label="Filters">
      <div class="chips" id="chips" role="group" aria-label="Filter by genre"></div>
      <label class="sort">
        <span>Sort by</span>
        <select id="sort">
          <option value="rating">Top rated</option>
          <option value="newest">Newest first</option>
          <option value="name">Title A–Z</option>
        </select>
      </label>
    </section>

    <p class="result-info" id="result-info" aria-live="polite"></p>

    <section id="grid" class="grid" aria-busy="false"></section>
    <section id="state" class="state" hidden></section>
  </main>

  <dialog id="modal" aria-labelledby="modal-title">
    <button class="close" id="modal-close" type="button" aria-label="Close details">×</button>
    <div id="modal-body"></div>
  </dialog>

  <footer>Data from the <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVmaze API</a>. Your watchlist is saved in this browser.</footer>
  <script src="script.js"></script>
</body>
</html>
